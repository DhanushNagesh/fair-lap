[project]
name = "fairlap"
version = "0.1.0"
description = "Lap-by-lap F1 win-probability model benchmarked against Polymarket in-race odds"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38", "altair>=5.4"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
fairlap-scan-coverage = "fairlap.ingest.scan_market_coverage:main"
fairlap-ingest-openf1 = "fairlap.ingest.openf1:main"
fairlap-ingest-polymarket = "fairlap.ingest.polymarket:main"
fairlap-features = "fairlap.transform.build_features:main"
fairlap-replay = "fairlap.replay.stream_race:main"
fairlap-eval = "fairlap.eval.compare_market:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairlap"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:fairlap.*"]
